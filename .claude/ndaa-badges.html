<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 40px; background: #F2F0ED; font-family: "Schibsted Grotesk", sans-serif; color: #011121; }
  h2 { font: 500 13px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #1F5B99; margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  .opt { flex: 1 1 300px; max-width: 420px; background: #fff; padding: 22px; }
  .big { display: flex; justify-content: center; padding: 18px 0 22px; }
  .big svg { width: 200px; height: auto; }
  .strip { display: flex; align-items: center; gap: 20px; padding: 18px 22px; border: 1px solid rgb(1 17 33 / .12); background: #F2F0ED; }
  .strip svg { width: 72px; height: auto; flex: none; }
  .strip p { margin: 0; font: 600 19.2px/1.3 "Schibsted Grotesk", sans-serif; }
  svg text { font-family: "Schibsted Grotesk", sans-serif; }
</style>
</head>
<body>
<template id="seal-arc">
  <svg viewBox="0 0 80 80" role="img" aria-label="NDAA compliant">
    <circle cx="40" cy="40" r="38" fill="#fff" stroke="#1F5B99" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="25.5" fill="none" stroke="#1F5B99" stroke-width="1"/>
    <path id="__top" d="M13 40 A27 27 0 0 1 67 40" fill="none"/>
    <path id="__bot" d="M6.5 40 A33.5 33.5 0 0 0 73.5 40" fill="none"/>
    <text font-size="10" font-weight="700" fill="#1F5B99" letter-spacing="1.2"><textPath href="#__top" startOffset="50%" text-anchor="middle">NDAA</textPath></text>
    <text font-size="8.4" font-weight="700" fill="#1F5B99" letter-spacing="1.1"><textPath href="#__bot" startOffset="50%" text-anchor="middle">COMPLIANT</textPath></text>
    <circle cx="9.5" cy="40" r="1.6" fill="#1F5B99"/>
    <circle cx="70.5" cy="40" r="1.6" fill="#1F5B99"/>
    <path d="M40 23 L54 28 Q55 28.4 55 29.5 V38 C55 48 47 54 40 57 C33 54 25 48 25 38 V29.5 Q25 28.4 26 28 Z" fill="#1F5B99"/>
    <path d="M31.5 40 L37.5 44.8 L47.5 32.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linejoin="miter"/>
  </svg>
</template>
<template id="seal-stack">
  <svg viewBox="0 0 80 80" role="img" aria-label="NDAA compliant">
    <circle cx="40" cy="40" r="38" fill="#fff" stroke="#1F5B99" stroke-width="2.5"/>
    <path d="M40 11 L49.5 14.4 Q50.2 14.7 50.2 15.4 V21.2 C50.2 28 44.8 32 40 34 C35.2 32 29.8 28 29.8 21.2 V15.4 Q29.8 14.7 30.5 14.4 Z" fill="#1F5B99"/>
    <path d="M34.2 22.3 L38.3 25.6 L45 17.2" fill="none" stroke="#fff" stroke-width="2.9" stroke-linejoin="miter"/>
    <text x="40" y="51.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1F5B99" letter-spacing=".2">NDAA</text>
    <text x="40" y="61.5" text-anchor="middle" font-size="7.2" font-weight="600" fill="#1F5B99" letter-spacing="1.1">COMPLIANT</text>
  </svg>
</template>

<div class="row">
  <div class="opt" data-seal="seal-arc">
    <h2>C1 · Seal, text on the ring</h2>
    <div class="big"></div>
    <div class="strip"><span class="slot"></span><p>All of our products are NDAA compliant</p></div>
  </div>
  <div class="opt" data-seal="seal-stack">
    <h2>C2 · Seal, text stacked</h2>
    <div class="big"></div>
    <div class="strip"><span class="slot"></span><p>All of our products are NDAA compliant</p></div>
  </div>
</div>
<script>
  // Stamp each seal twice (large + strip size) with unique path ids.
  let n = 0;
  document.querySelectorAll('[data-seal]').forEach(opt => {
    const tpl = document.getElementById(opt.dataset.seal).innerHTML;
    opt.querySelector('.big').innerHTML = tpl.replaceAll('__', 's' + (n++) + '-');
    opt.querySelector('.slot').outerHTML = tpl.replaceAll('__', 's' + (n++) + '-');
  });
</script>
</body>
</html>
